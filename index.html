<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hypotheekmarkt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="card login-card">
    <div class="kicker">Privé</div>
    <h1>Hypotheekmarkt</h1>
    <label>E-mailadres<input id="email" type="email" autocomplete="username" required></label>
    <label>Wachtwoord<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn">Inloggen</button>
    <p id="loginErr" class="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div>
      <div class="kicker" id="kicker">Ochtendoverzicht</div>
      <h1>Hypotheekmarkt</h1>
    </div>
    <div class="sub" id="sub"></div>
  </header>
  <nav class="tabs" aria-label="Hoofdmenu">
    <a href="#dag" data-v="dag">Dag</a>
    <a href="#week" data-v="week">Week</a>
    <a href="#archief" data-v="archief">Archief</a>
    <a href="#grafieken" data-v="grafieken">Grafieken</a>
    <span class="grow"></span>
    <button id="logout" class="link">Uitloggen</button>
  </nav>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
